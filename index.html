<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Player Impact Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="glow-bg"></div>
  
  <div class="dashboard-container">
    <header>
      <div class="badge">2024–25 Analytics</div>
      <h1>NBA Player Impact Lab</h1>
      <p>Head-to-head performance profile & metric breakdown</p>
    </header>

    <!-- Controls Row -->
    <section class="controls-card">
      <div class="player-column p1-column">
        <div class="player-header">
          <img id="p1-control-logo" class="control-team-logo" src="" alt="Team Logo" />
          <h3>Player 1</h3>
        </div>
        <div class="select-group">
          <label for="team1-select">Team</label>
          <select id="team1-select"></select>
        </div>
        <div class="select-group">
          <label for="player1-select">Player</label>
          <select id="player1-select"></select>
        </div>
      </div>

      <div class="versus-badge">VS</div>

      <div class="player-column p2-column">
        <div class="player-header">
          <img id="p2-control-logo" class="control-team-logo" src="" alt="Team Logo" />
          <h3>Player 2</h3>
        </div>
        <div class="select-group">
          <label for="team2-select">Team</label>
          <select id="team2-select"></select>
        </div>
        <div class="select-group">
          <label for="player2-select">Player</label>
          <select id="player2-select"></select>
        </div>
      </div>
    </section>

    <!-- 3-Column Analytics Layout -->
    <div class="analytics-layout">
      <!-- Left Box: Player 1 Stats -->
      <div class="player-stats-card p1-card">
        <div class="card-header">
          <div class="player-title-group">
            <img id="p1-card-logo" class="card-team-logo" src="" alt="Team Logo" />
            <h2 id="p1-card-name">Player 1</h2>
          </div>
          <span id="p1-card-team" class="team-tag p1-tag">GSW</span>
        </div>
        <div id="p1-stats-list" class="stats-list"></div>
      </div>

      <!-- Middle Box: Skill Radar -->
      <div class="chart-card">
        <h2>Skill Profile Radar</h2>
        <div class="chart-container">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

      <!-- Right Box: Player 2 Stats -->
      <div class="player-stats-card p2-card">
        <div class="card-header">
          <div class="player-title-group">
            <img id="p2-card-logo" class="card-team-logo" src="" alt="Team Logo" />
            <h2 id="p2-card-name">Player 2</h2>
          </div>
          <span id="p2-card-team" class="team-tag p2-tag">BOS</span>
        </div>
        <div id="p2-stats-list" class="stats-list"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
